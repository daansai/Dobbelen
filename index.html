<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dobbelen</title>
<meta name="theme-color" content="#14161c">
<meta name="description" content="Dobbelen: een drankspel met 2 dobbelstenen, gebaseerd op Mexen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dobbelen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #14161c;
    --panel: #1e222b;
    --panel-2: #272c38;
    --text: #f2f3f5;
    --muted: #9aa1b0;
    --accent: #f5b83d;
    --accent-text: #1a1303;
    --danger: #ef5b5b;
    --ok: #4cc38a;
    --die: #fbfbf8;
    --pip: #1b1d22;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { margin: 8px 0 4px; font-size: 1.8rem; letter-spacing: .02em; }
  h2 { margin: 0 0 8px; font-size: 1.1rem; }
  p { margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  [hidden] { display: none !important; }

  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer;
    background: var(--panel-2); color: var(--text); min-height: 46px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-text); font-weight: 700; }
  button.danger { background: var(--danger); color: #fff; }
  button.ghost { background: transparent; border: 1px solid var(--panel-2); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }

  input[type=text] { font: inherit; width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid var(--panel-2); background: var(--bg); color: var(--text); }
  .player-input { display: flex; gap: 8px; margin-bottom: 8px; }
  .player-input button { flex: 0 0 auto; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .topbar .row { flex: 0 0 auto; }
  .topbar button { padding: 8px 12px; min-height: 38px; }

  .scoreboard { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel-2); border-radius: 999px; padding: 4px 10px; font-size: .9rem; }
  .chip.active { outline: 2px solid var(--accent); }
  .chip b { color: var(--accent); }

  .turn { text-align: center; }
  .turn .who { font-size: 1.5rem; font-weight: 700; }
  .tray { position: relative; height: 290px; perspective: 900px; margin: 4px 0 0; user-select: none; }
  .table { --tw: 320px; --th: 230px; position: absolute; left: 50%; top: 62%; width: var(--tw); height: var(--th);
    margin: calc(var(--th) / -2) 0 0 calc(var(--tw) / -2); transform: rotateX(52deg); transform-style: preserve-3d;
    border-radius: 20px; background: radial-gradient(ellipse at center, #2f7a58 0%, #1d4d39 75%, #153a2b 100%);
    box-shadow: inset 0 0 0 6px #5a3b22, inset 0 0 22px 8px rgba(0,0,0,.45); }
  .cube3d { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
    transform-style: preserve-3d; will-change: transform; }
  .face { position: absolute; inset: 0; border-radius: 9px; padding: 7px; display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr); backface-visibility: hidden;
    background: linear-gradient(145deg, #ffffff 0%, #e7e6df 100%); box-shadow: inset 0 0 7px rgba(0,0,0,.22); }
  .face.f1 { transform: translateZ(29px); }
  .face.f6 { transform: rotateY(180deg) translateZ(29px); }
  .face.f2 { transform: rotateY(90deg) translateZ(29px); }
  .face.f5 { transform: rotateY(-90deg) translateZ(29px); }
  .face.f3 { transform: rotateX(-90deg) translateZ(29px); }
  .face.f4 { transform: rotateX(90deg) translateZ(29px); }
  .pip3d { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a4d55, #111216 70%); }
  .pip3d.red { background: radial-gradient(circle at 35% 30%, #ff7a7a, #b30f1f 70%); }
  .shadow3d { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
    border-radius: 14px; background: #000; filter: blur(7px); }
  .die { width: 84px; height: 84px; background: var(--die); border-radius: 16px; padding: 10px;
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); box-shadow: 0 4px 0 #b9b9b0, 0 8px 18px rgba(0,0,0,.4); }
  .die.small { width: 48px; height: 48px; padding: 6px; border-radius: 10px; box-shadow: 0 2px 0 #b9b9b0; }
  .pip { background: var(--pip); border-radius: 50%; width: 100%; height: 100%; }
  .result { font-size: 1.3rem; font-weight: 700; min-height: 1.8em; }
  .hint { color: var(--muted); min-height: 2.6em; }
  .throws { color: var(--muted); font-size: .9rem; }

  ol.list, ul.list { margin: 0; padding-left: 20px; }
  ul.log { list-style: none; padding: 0; margin: 0; color: var(--muted); font-size: .92rem; }
  ul.log li { padding: 3px 0; border-bottom: 1px solid var(--panel-2); }
  ul.log li:first-child { color: var(--text); }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex;
    align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal { background: var(--panel); border-radius: 16px; padding: 18px; width: 100%; max-width: 440px;
    max-height: 90vh; overflow: auto; }
  .modal .buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .versus { display: flex; align-items: center; justify-content: space-around; gap: 8px; margin: 10px 0; text-align: center; }
  .versus .side { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .versus .side .pair { display: flex; gap: 6px; }
  .loser { color: var(--danger); font-weight: 700; }
  table.rank { width: 100%; border-collapse: collapse; }
  table.rank td { padding: 4px 6px; border-bottom: 1px solid var(--panel-2); }
  table.rank td:last-child { text-align: right; }
  table.rank tr.lowest td { color: var(--danger); font-weight: 700; }
  .rules h3 { margin: 12px 0 4px; font-size: 1rem; color: var(--accent); }
</style>
</head>
<body>
<main>
  <!-- Setup -->
  <section id="setup">
    <h1>🎲 Dobbelen</h1>
    <p class="muted">Een drankspel met 2 dobbelstenen, gebaseerd op Mexen. Wie de laagste worp heeft, drinkt.</p>
    <div class="panel">
      <h2>Spelers</h2>
      <div id="playerInputs"></div>
      <div class="row">
        <button id="addPlayer" class="ghost">+ Speler toevoegen</button>
        <button id="startGame" class="primary">Start spel</button>
      </div>
    </div>
    <button id="rulesFromSetup" class="ghost" style="width:100%">Bekijk de regels</button>
    <button id="installBtn" class="primary" style="width:100%; margin-top:10px" hidden>📲 Installeer als app</button>
    <p id="iosHint" class="muted" style="margin-top:10px" hidden>Op iPhone: tik op Deel en kies "Zet op beginscherm" om dit als app te installeren.</p>
  </section>

  <!-- Game -->
  <section id="game" hidden>
    <div class="topbar">
      <h2 id="roundLabel">Ronde 1</h2>
      <div class="row">
        <button id="rulesBtn" class="ghost">Regels</button>
        <button id="resetBtn" class="ghost">Stop</button>
      </div>
    </div>

    <div class="panel">
      <div id="scoreboard" class="scoreboard"></div>
      <div id="hundredBar" class="muted" style="margin-top:8px" hidden></div>
    </div>

    <div class="panel turn">
      <div class="muted">Aan de beurt</div>
      <div class="who" id="who"></div>
      <div class="tray" id="tray"><div class="table" id="table"></div></div>
      <div class="result" id="result"></div>
      <div class="hint" id="hint"></div>
      <div class="throws" id="throws"></div>
      <div class="row" id="actions" style="margin-top:10px"></div>
    </div>

    <div class="panel">
      <h2>Deze ronde</h2>
      <div id="roundScores" class="muted">Nog niemand gegooid.</div>
    </div>

    <div class="panel">
      <h2>Verloop</h2>
      <ul class="log" id="log"></ul>
    </div>
  </section>
</main>

<div id="overlay" class="overlay" hidden><div class="modal" id="modal"></div></div>

<script>
'use strict';

/* ---------- Scoring ---------- */
const MEX = 1000;

// Score value: Mex (2+1) > doubles (11 = 100 ... 66 = 600) > two-digit number, highest die first.
function scoreOf([a, b]) {
  const hi = Math.max(a, b), lo = Math.min(a, b);
  if (hi === 2 && lo === 1) return MEX;
  if (a === b) return a * 100;
  return hi * 10 + lo;
}
function labelOf(dice) {
  const v = scoreOf(dice);
  if (v === MEX) return 'Mex!';
  if (dice[0] === dice[1]) return `Dubbel ${dice[0]} (${v})`;
  return String(v);
}
function isDouble(dice) { return dice[0] === dice[1]; }

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const rnd = () => 1 + Math.floor(Math.random() * 6);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) e.append(kid);
  return e;
}
const PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
function dieEl(n, small = false) {
  const d = el('div', { class: 'die' + (small ? ' small' : '') });
  for (const cell of PIPS[n]) {
    const p = el('div', { class: 'pip' });
    p.style.gridArea = `${Math.ceil(cell / 3)} / ${((cell - 1) % 3) + 1}`;
    d.append(p);
  }
  return d;
}
function slokken(n) { return `${n} ${n === 1 ? 'slok' : 'slokken'}`; }

/* ---------- Modal ---------- */
// onOpen(close) hands the caller a function to close the modal programmatically.
function showModal(content, buttons, onOpen) {
  return new Promise(resolve => {
    let finished = false;
    const close = value => {
      if (finished) return;
      finished = true;
      $('overlay').hidden = true;
      resolve(value);
    };
    const modal = $('modal');
    modal.replaceChildren(...content);
    const box = el('div', { class: 'buttons' });
    for (const b of buttons) {
      box.append(el('button', { class: b.cls || '', text: b.label, onclick: () => close(b.value) }));
    }
    modal.append(box);
    $('overlay').hidden = false;
    if (onOpen) onOpen(close);
  });
}

/* ---------- State ---------- */
const state = {
  players: [],          // { name, drinks }
  round: 1,
  starter: 0,
  order: [],            // player indices in turn order this round
  pos: 0,               // position in order
  scores: [],           // { p, value, label }
  throws: 0,
  dice: null,
  hundred: null,        // index of current "100 man"
  log: [],
  busy: false,
};

function addLog(text) {
  state.log.unshift(text);
  state.log = state.log.slice(0, 8);
  renderLog();
}
function giveDrinks(p, n) { state.players[p].drinks += n; renderScoreboard(); }

/* ---------- Setup screen ---------- */
function loadNames() {
  try {
    const saved = JSON.parse(localStorage.getItem('dobbelen.names'));
    if (Array.isArray(saved) && saved.length >= 2) return saved;
  } catch (e) { /* storage unavailable */ }
  return ['Speler 1', 'Speler 2'];
}
function saveNames(names) {
  try { localStorage.setItem('dobbelen.names', JSON.stringify(names)); } catch (e) { /* ignore */ }
}
function renderSetup(names) {
  const box = $('playerInputs');
  box.replaceChildren();
  names.forEach((name, i) => {
    const input = el('input', { type: 'text', maxlength: '20', value: name, 'aria-label': `Naam speler ${i + 1}`, placeholder: `Speler ${i + 1}` });
    const row = el('div', { class: 'player-input' }, input);
    if (names.length > 2) {
      row.append(el('button', { class: 'ghost', 'aria-label': 'Verwijder speler', text: '✕', onclick: () => {
        const cur = readNames(); cur.splice(i, 1); renderSetup(cur);
      } }));
    }
    box.append(row);
  });
}
function readNames() {
  return [...$('playerInputs').querySelectorAll('input')].map(i => i.value);
}

$('addPlayer').addEventListener('click', () => {
  const cur = readNames();
  if (cur.length >= 12) return;
  cur.push(`Speler ${cur.length + 1}`);
  renderSetup(cur);
});
$('startGame').addEventListener('click', () => {
  const names = readNames().map((n, i) => n.trim() || `Speler ${i + 1}`);
  saveNames(names);
  state.players = names.map(name => ({ name, drinks: 0 }));
  state.round = 1;
  state.starter = 0;
  state.hundred = null;
  state.log = [];
  $('setup').hidden = true;
  $('game').hidden = false;
  Dice3D.init($('table'));
  Dice3D.rest([rnd(), rnd()]);
  startRound();
});
$('resetBtn').addEventListener('click', async () => {
  const ok = await showModal([el('h2', { text: 'Spel stoppen?' }), el('p', { class: 'muted', text: 'De stand gaat verloren.' })],
    [{ label: 'Ja, stop', cls: 'danger', value: true }, { label: 'Doorspelen', value: false }]);
  if (!ok) return;
  $('game').hidden = true;
  $('setup').hidden = false;
  renderSetup(loadNames());
});

/* ---------- Rules ---------- */
function showRules() {
  const c = el('div', { class: 'rules' },
    el('h2', { text: 'Regels' }),
    el('p', { text: 'Iedereen gooit om de beurt met 2 dobbelstenen. Je mag maximaal 3x gooien: na elke worp pas je, of je gooit opnieuw. Na de derde worp moet je het resultaat houden. Wie aan het eind van de ronde de laagste worp heeft, drinkt 2 slokken. Is er in die ronde een Mex gegooid, dan is de straf dubbel: 4 slokken.' }),
    el('h3', { text: 'Volgorde (hoog naar laag)' }),
    el('p', { text: 'Mex (2 en 1) › dubbel (66 hoogst, 11 laagst) › overige worpen als tweecijferig getal met het hoogste cijfer eerst (5 en 3 = 53).' }),
    el('h3', { text: '32' }), el('p', { text: 'Je deelt 2 slokken uit aan een speler naar keuze en gooit daarna opnieuw (weer 3 worpen).' }),
    el('h3', { text: '31' }), el('p', { text: 'Je battlet met een willekeurige speler. Jullie gooien allebei; wie het hoogste gooit moet drinken. Daarna gooi je opnieuw (weer 3 worpen).' }),
    el('h3', { text: 'Dubbel 1 = 100 man' }), el('p', { text: 'Je wordt de 100 man. Is er al een 100 man, dan neem je het over en hoeft de oude niet te drinken. Elke keer dat iemand daarna een hoger honderdtal gooit (22 = 200 … 66 = 600), moet de 100 man dat aantal slokken drinken. 500 = 5 slokken.' }),
    el('h3', { text: '65' }), el('p', { text: 'Je kiest: 65 als score houden, of de telefoon-spin. Leg je telefoon plat op tafel en laat hem één (bijna) perfect rondje draaien; het spel meet met de bewegingssensor of het gelukt is (360°, ruim 45° speling). Lukt dat, dan draaien de dobbelstenen om (6 en 5 worden 1 en 2) en heb je Mex. Lukt het niet, dan blijft het 65.' }),
  );
  return showModal([c], [{ label: 'Sluiten', cls: 'primary', value: null }]);
}
$('rulesBtn').addEventListener('click', showRules);
$('rulesFromSetup').addEventListener('click', showRules);

/* ---------- Rendering ---------- */
function renderScoreboard() {
  const box = $('scoreboard');
  box.replaceChildren();
  state.players.forEach((p, i) => {
    const active = state.order[state.pos] === i;
    const chip = el('span', { class: 'chip' + (active ? ' active' : '') });
    chip.append(`${state.hundred === i ? '💯 ' : ''}${p.name} `, el('b', { text: String(p.drinks) }));
    box.append(chip);
  });
  // The 100 man stays until someone else throws double 1, or the whole game is stopped.
  const bar = $('hundredBar');
  bar.hidden = state.hundred === null;
  if (state.hundred !== null) bar.textContent = `💯 100 man: ${state.players[state.hundred].name}`;
}
function renderLog() {
  $('log').replaceChildren(...state.log.map(t => el('li', { text: t })));
}
function renderRoundScores() {
  const box = $('roundScores');
  if (!state.scores.length) { box.textContent = 'Nog niemand gegooid.'; return; }
  box.replaceChildren(el('ul', { class: 'list' }, ...state.scores.map(s =>
    el('li', { text: `${state.players[s.p].name}: ${s.label}` }))));
}
function setActions(buttons) {
  $('actions').replaceChildren(...buttons.map(b =>
    el('button', { class: b.cls || '', text: b.label, onclick: b.onClick })));
}

/* ---------- Round flow ---------- */
function startRound() {
  const n = state.players.length;
  state.order = Array.from({ length: n }, (_, i) => (state.starter + i) % n);
  state.pos = 0;
  state.scores = [];
  $('roundLabel').textContent = `Ronde ${state.round}`;
  renderRoundScores();
  renderLog();
  beginTurn();
}

function beginTurn() {
  state.throws = 0;
  state.dice = null;
  state.busy = false;
  const p = state.order[state.pos];
  $('who').textContent = state.players[p].name;
  $('result').textContent = '';
  $('hint').textContent = 'Gooi de dobbelstenen!';
  $('throws').textContent = '';
  renderScoreboard();
  setActions([{ label: '🎲 Gooi', cls: 'primary', onClick: roll }]);
}

async function roll() {
  if (state.busy) return;
  state.busy = true;
  setActions([]);
  state.throws++;
  $('result').textContent = '';
  $('hint').textContent = '';
  state.dice = await Dice3D.throwDice();
  const v = scoreOf(state.dice);
  if (v === 31 || v === 32) {
    // 31/32 can't be kept: do the effect, then the player starts over with a fresh throw.
    $('result').textContent = labelOf(state.dice);
    addLog(`${state.players[state.order[state.pos]].name} gooit ${v}.`);
    await sleep(700);
    await (v === 32 ? effect32 : effect31)(state.order[state.pos]);
    state.throws = 0;
    state.dice = null;
    $('result').textContent = '';
    $('throws').textContent = '';
    $('hint').textContent = `${v}! Gooi opnieuw.`;
    setActions([{ label: '🎲 Gooi opnieuw', cls: 'primary', onClick: roll }]);
    state.busy = false;
    return;
  }
  presentThrow();
  state.busy = false;
}

function presentThrow() {
  const dice = state.dice;
  const v = scoreOf(dice);
  $('result').textContent = labelOf(dice);
  $('throws').textContent = `Worp ${state.throws} van 3`;
  const hints = [];
  if (dice[0] === 1 && dice[1] === 1) hints.push('Dubbel 1: je wordt de 100 man!');
  else if (isDouble(dice) && state.hundred !== null) hints.push(`${v}: de 100 man drinkt ${slokken(dice[0])}.`);
  if (v === 65) hints.push('65: houden, of de telefoon-spin proberen voor Mex.');
  $('hint').textContent = hints.join(' ');

  const last = state.throws >= 3;
  const buttons = [{ label: last ? 'Verder' : 'Pas', cls: 'primary', onClick: () => accept(dice) }];
  if (!last) buttons.push({ label: `Gooi opnieuw (${3 - state.throws} over)`, onClick: roll });
  if (v === 65) buttons.push({ label: '📱 Telefoon-spin', onClick: phoneSpin });
  setActions(buttons);
}

/* ---------- Phone spin (sensor check) ---------- */
const SPIN_TARGET = 360, SPIN_TOLERANCE = 45;

function spinIsOk(degrees) { return Math.abs(Math.abs(degrees) - SPIN_TARGET) <= SPIN_TOLERANCE; }

// Integrates rotation rate (deg/s, around the vertical axis of a phone lying flat) until the phone comes to rest.
function createSpinDetector(onProgress, onDone) {
  let total = 0, last = null, started = false, calmSince = null, done = false;
  return function feed(rate, t) {
    if (done) return;
    if (last === null) { last = t; return; }
    const dt = Math.min((t - last) / 1000, 0.2);
    last = t;
    if (Math.abs(rate) > 10) total += rate * dt;
    if (Math.abs(rate) > 25) { started = true; calmSince = null; }
    else if (started) {
      if (calmSince === null) calmSince = t;
      else if (t - calmSince >= 600) { done = true; onDone(total); return; }
    }
    onProgress(total);
  };
}

async function phoneSpin() {
  if (state.busy) return;
  state.busy = true;
  setActions([]);

  // iOS asks for motion permission; this must happen directly in the click handler.
  let permissionDenied = false;
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      permissionDenied = (await DeviceMotionEvent.requestPermission()) !== 'granted';
    }
  } catch (e) { permissionDenied = true; }

  const name = state.players[state.order[state.pos]].name;
  const live = el('div', { class: 'result', text: '0°' });
  const status = el('p', { class: 'muted', text: permissionDenied ? 'Geen toegang tot de bewegingssensor.' : 'Wachten op de bewegingssensor…' });
  const fallback = el('div', { class: 'buttons', hidden: '' });
  let sensorSeen = false, listener = null, simTimer = null, close = () => {};

  const outcome = await showModal([
    el('h2', { text: '📱 Telefoon-spin' }),
    el('p', { text: `${name}, leg je telefoon plat op tafel en laat hem één perfect rondje draaien (360°).` }),
    live, status, fallback,
  ], [{ label: 'Annuleren', cls: 'ghost', value: { cancel: true } }], c => {
    close = c;
    const feed = createSpinDetector(
      deg => { live.textContent = `${Math.round(Math.abs(deg))}°`; },
      deg => close({ degrees: deg }));

    listener = e => {
      const r = e.rotationRate;
      if (!r || r.alpha == null) return;
      if (!sensorSeen) { sensorSeen = true; fallback.hidden = true; status.textContent = 'Sensor actief: draai je telefoon!'; }
      feed(r.alpha, e.timeStamp || performance.now());
    };
    if (!permissionDenied) window.addEventListener('devicemotion', listener);

    // No sensor (e.g. a PC): offer manual approval and a simulation so the game can still be tested.
    setTimeout(() => {
      if (sensorSeen) return;
      status.textContent = 'Geen bewegingssensor gevonden (pc?). Kies hieronder.';
      fallback.hidden = false;
    }, permissionDenied ? 0 : 1500);

    const simulate = deg => {
      if (simTimer) return;
      let t = performance.now(), rotated = 0, calm = 0;
      const rate = deg > 0 ? 240 : 0;
      simTimer = setInterval(() => {
        t += 16;
        if (rotated < deg) { rotated += rate * 0.016; feed(rate, t); }
        else { calm += 16; feed(0, t); if (calm > 1000) clearInterval(simTimer); }
      }, 16);
    };
    fallback.append(
      el('button', { text: 'Test: simuleer spin van 360°', onclick: () => simulate(360) }),
      el('button', { text: 'Test: simuleer spin van 180°', onclick: () => simulate(180) }),
      el('button', { text: 'Zonder sensor: gelukt (zelf beslissen)', onclick: () => close({ manual: true, ok: true }) }),
      el('button', { text: 'Zonder sensor: mislukt', onclick: () => close({ manual: true, ok: false }) }),
    );
  });

  if (listener) window.removeEventListener('devicemotion', listener);
  if (simTimer) clearInterval(simTimer);

  if (outcome.cancel) { state.busy = false; presentThrow(); return; }

  let ok;
  if (outcome.manual) ok = outcome.ok;
  else {
    const deg = Math.round(Math.abs(outcome.degrees));
    ok = spinIsOk(outcome.degrees);
    await showModal([
      el('h2', { text: ok ? '✅ Gelukt!' : '❌ Mislukt' }),
      el('p', { text: `Gemeten: ${deg}° (doel ${SPIN_TARGET}° ± ${SPIN_TOLERANCE}°).` }),
    ], [{ label: 'Verder', cls: 'primary', value: true }]);
  }

  if (ok) {
    $('hint').textContent = 'De dobbelstenen draaien om: 65 wordt Mex.';
    state.dice = await Dice3D.flipOver();
    $('result').textContent = 'Mex!';
    addLog(`${name} draait de telefoon rond: 65 wordt Mex!`);
  } else {
    addLog(`${name} mist de telefoon-spin en houdt 65.`);
  }
  await accept(state.dice, true);
}

async function accept(dice, fromPhone = false) {
  if (state.busy && !fromPhone) return;
  state.busy = true;
  setActions([]);
  const p = state.order[state.pos];
  const name = state.players[p].name;
  const value = scoreOf(dice);
  const label = labelOf(dice);
  state.scores.push({ p, value, label });
  renderRoundScores();
  addLog(`${name} gooit ${label.replace(/!$/, "")}.`);

  // 31/32 are handled at throw time; doubles only count for the dice as kept (not a phone-spin Mex).
  if (isDouble(dice)) await effectDouble(p, dice[0]);

  nextTurn();
}

/* ---------- Special effects ---------- */
async function effect32(p) {
  const others = state.players.map((pl, i) => i).filter(i => i !== p);
  const target = await showModal(
    [el('h2', { text: '32! Deel 2 slokken uit' }), el('p', { class: 'muted', text: `${state.players[p].name}, wie moet drinken?` })],
    others.map(i => ({ label: state.players[i].name, value: i })));
  giveDrinks(target, 2);
  addLog(`${state.players[p].name} deelt 2 slokken uit aan ${state.players[target].name}.`);
}

async function effect31(p) {
  const others = state.players.map((pl, i) => i).filter(i => i !== p);
  const opp = others[Math.floor(Math.random() * others.length)];
  const nameA = state.players[p].name, nameB = state.players[opp].name;
  let a, b;
  do { a = [rnd(), rnd()]; b = [rnd(), rnd()]; } while (scoreOf(a) === scoreOf(b));
  const loser = scoreOf(a) > scoreOf(b) ? p : opp; // hoogste gooit moet drinken
  const side = (name, dice, isLoser) => el('div', { class: 'side' },
    el('div', { class: isLoser ? 'loser' : '', text: name }),
    el('div', { class: 'pair' }, dieEl(dice[0], true), dieEl(dice[1], true)),
    el('div', { class: isLoser ? 'loser' : 'muted', text: labelOf(dice) }));
  await showModal([
    el('h2', { text: '31! Battle' }),
    el('p', { class: 'muted', text: `${nameA} battlet met ${nameB}. Wie het hoogste gooit moet drinken.` }),
    el('div', { class: 'versus' }, side(nameA, a, loser === p), el('b', { text: 'VS' }), side(nameB, b, loser === opp)),
    el('p', { text: `${state.players[loser].name} drinkt!` }),
  ], [{ label: 'Verder', cls: 'primary', value: true }]);
  giveDrinks(loser, 1);
  addLog(`Battle ${nameA} vs ${nameB}: ${state.players[loser].name} drinkt.`);
}

async function effectDouble(p, n) {
  const name = state.players[p].name;
  const prev = state.hundred;
  if (n === 1) {
    // A new 100 man takes over; the old one doesn't have to drink.
    state.hundred = p;
    renderScoreboard();
    addLog(`${name} is de nieuwe 100 man!`);
    await showModal([
      el('h2', { text: '💯 100 man!' }),
      el('p', { text: `${name} is nu de 100 man.` }),
      prev !== null && prev !== p ? el('p', { class: 'muted', text: `${state.players[prev].name} is de 100 man kwijt en hoeft niet te drinken.` }) : null,
    ].filter(Boolean), [{ label: 'Verder', cls: 'primary', value: true }]);
  } else if (prev !== null) {
    giveDrinks(prev, n);
    addLog(`100 man ${state.players[prev].name} drinkt ${slokken(n)}.`);
    await showModal([
      el('h2', { text: `${n * 100}!` }),
      el('p', { text: `${state.players[prev].name} (100 man) drinkt ${slokken(n)}.` }),
    ], [{ label: 'Verder', cls: 'primary', value: true }]);
  }
}

/* ---------- End of turn / round ---------- */
async function nextTurn() {
  state.pos++;
  if (state.pos < state.order.length) { beginTurn(); return; }
  await endRound();
}

async function endRound() {
  const min = Math.min(...state.scores.map(s => s.value));
  const losers = state.scores.filter(s => s.value === min).map(s => s.p);
  // The loser drinks 2 slokken; if someone threw a Mex this round it's doubled.
  const mexThrown = state.scores.some(s => s.value === MEX);
  const amount = mexThrown ? 4 : 2;
  for (const p of losers) giveDrinks(p, amount);
  const names = losers.map(p => state.players[p].name).join(' en ');
  addLog(`Ronde ${state.round}: ${names} ${losers.length > 1 ? 'drinken' : 'drinkt'} ${slokken(amount)} (laagste worp${mexThrown ? ', Mex: dubbel' : ''}).`);

  const sorted = [...state.scores].sort((x, y) => y.value - x.value);
  const table = el('table', { class: 'rank' }, ...sorted.map(s =>
    el('tr', { class: s.value === min ? 'lowest' : '' },
      el('td', { text: state.players[s.p].name }), el('td', { text: s.label }))));
  await showModal([
    el('h2', { text: `Einde ronde ${state.round}` }),
    table,
    el('p', { style: 'margin-top:10px', text: `🍺 ${names} ${losers.length > 1 ? 'drinken' : 'drinkt'} ${slokken(amount)}!` }),
    mexThrown ? el('p', { class: 'muted', text: 'Er is een Mex gegooid, dus de straf is dubbel.' }) : null,
  ].filter(Boolean), [{ label: 'Volgende ronde', cls: 'primary', value: true }]);

  state.starter = losers[0];
  state.round++;
  startRound();
}

/* ---------- 3D dice with physics ---------- */
// The dice are thrown into a tray, fall, bounce off the floor, walls and each other, and tip over until a face
// lies flat. The result is simply whichever face ends up on top. Physics runs in right-handed coordinates
// (X right, Y away from the viewer, Z up); CSS uses a mirrored Y axis, handled in toCss().
const Dice3D = (() => {
  const SIZE = 58, HALF = SIZE / 2, RADIUS = HALF * 1.25, G = 1500;
  // Local face normals (opposite faces add up to 7).
  const FACE_N = { 1: [0, 0, 1], 6: [0, 0, -1], 2: [1, 0, 0], 5: [-1, 0, 0], 3: [0, -1, 0], 4: [0, 1, 0] };
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  const qmul = (a, b) => [
    a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
    a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
    a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
    a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0]];
  const qnorm = q => { const l = Math.hypot(...q) || 1; return q.map(c => c / l); };
  const qaxis = (ax, ang) => { const s = Math.sin(ang / 2); return [Math.cos(ang / 2), ax[0] * s, ax[1] * s, ax[2] * s]; };
  const qrand = () => qnorm([0, 0, 0, 0].map(() => rand(-1, 1) + rand(-1, 1) + rand(-1, 1)));
  function qmat(q) {
    const [w, x, y, z] = q;
    return [[1 - 2 * (y * y + z * z), 2 * (x * y - w * z), 2 * (x * z + w * y)],
            [2 * (x * y + w * z), 1 - 2 * (x * x + z * z), 2 * (y * z - w * x)],
            [2 * (x * z - w * y), 2 * (y * z + w * x), 1 - 2 * (x * x + y * y)]];
  }
  const mulv = (m, v) => [0, 1, 2].map(i => m[i][0] * v[0] + m[i][1] * v[1] + m[i][2] * v[2]);
  function qslerp(a, b, t) {
    let d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
    if (d < 0) { b = b.map(c => -c); d = -d; }
    if (d > 0.9995) return qnorm(a.map((c, i) => c + (b[i] - c) * t));
    const th = Math.acos(d), s = Math.sin(th);
    const f = Math.sin((1 - t) * th) / s, g = Math.sin(t * th) / s;
    return a.map((c, i) => c * f + b[i] * g);
  }
  // Rotation that turns world vector n onto "up" (0,0,1) by the shortest way, scaled by fraction.
  function arcToUp(n, fraction = 1) {
    const ang = Math.acos(clamp(n[2], -1, 1));
    if (ang < 1e-5) return [1, 0, 0, 0];
    let ax = [n[1], -n[0], 0];
    const l = Math.hypot(ax[0], ax[1]);
    ax = l < 1e-9 ? [1, 0, 0] : [ax[0] / l, ax[1] / l, 0];
    return qaxis(ax, ang * fraction);
  }
  // The face that's currently most upward, as {value, normal in world coords}.
  function topFace(q) {
    const m = qmat(q);
    let best = null;
    for (const v of [1, 2, 3, 4, 5, 6]) {
      const n = mulv(m, FACE_N[v]);
      if (!best || n[2] > best.n[2]) best = { value: v, n };
    }
    return best;
  }

  let table = null, W = 320, H = 240, dice = [], running = false, raf = 0;

  function makeDie() {
    const cube = document.createElement('div');
    cube.className = 'cube3d';
    for (let v = 1; v <= 6; v++) {
      const f = document.createElement('div');
      f.className = `face f${v}`;
      const pips = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] }[v];
      for (const cell of pips) {
        const p = document.createElement('div');
        p.className = 'pip3d' + (v === 1 ? ' red' : '');
        p.style.gridArea = `${Math.ceil(cell / 3)} / ${((cell - 1) % 3) + 1}`;
        f.append(p);
      }
      cube.append(f);
    }
    const shadow = document.createElement('div');
    shadow.className = 'shadow3d';
    table.append(shadow, cube);
    return { el: cube, shadow, p: [0, 0, HALF], v: [0, 0, 0], q: [1, 0, 0, 0], w: [0, 0, 0], done: true, calm: 0 };
  }

  function toCss(d) {
    const m = qmat(d.q), s = [1, -1, 1];
    const c = (i, j) => (m[i][j] * s[i] * s[j]).toFixed(5);
    d.el.style.transform = `translate3d(${d.p[0].toFixed(1)}px,${(-d.p[1]).toFixed(1)}px,${d.p[2].toFixed(1)}px) matrix3d(` +
      `${c(0, 0)},${c(1, 0)},${c(2, 0)},0,${c(0, 1)},${c(1, 1)},${c(2, 1)},0,${c(0, 2)},${c(1, 2)},${c(2, 2)},0,0,0,0,1)`;
    const h = Math.max(0, d.p[2] - HALF);
    d.shadow.style.transform = `translate3d(${d.p[0].toFixed(1)}px,${(-d.p[1]).toFixed(1)}px,0.5px) scale(${(1 + h / 260).toFixed(3)})`;
    d.shadow.style.opacity = clamp(0.6 - h / 420, 0.12, 0.6).toFixed(2);
  }

  function layout() {
    const tray = table.parentElement;
    W = clamp(tray.clientWidth - 8, 240, 520);
    H = 230;
    table.style.setProperty('--tw', `${W}px`);
    table.style.setProperty('--th', `${H}px`);
  }

  function init(tableEl) {
    table = tableEl;
    table.replaceChildren();
    dice = [makeDie(), makeDie()];
    layout();
    window.addEventListener('resize', () => { layout(); dice.forEach(d => { clampToTable(d); toCss(d); }); });
  }
  function clampToTable(d) {
    d.p[0] = clamp(d.p[0], -(W / 2 - RADIUS), W / 2 - RADIUS);
    d.p[1] = clamp(d.p[1], -(H / 2 - RADIUS), H / 2 - RADIUS);
  }

  // Place the dice at rest showing the given values.
  function rest(values) {
    layout();
    dice.forEach((d, i) => {
      const n = mulv(qmat([1, 0, 0, 0]), FACE_N[values[i]]);
      d.q = qnorm(qmul(qaxis([0, 0, 1], rand(0, Math.PI * 2)), arcToUp(n)));
      d.p = [(i === 0 ? -1 : 1) * rand(45, 70), rand(-35, 35), HALF];
      d.v = [0, 0, 0]; d.w = [0, 0, 0]; d.done = true;
      toCss(d);
    });
  }
  const values = () => dice.map(d => topFace(d.q).value);

  function step(d, dt, elapsed, forcedFace) {
    d.v[2] -= G * dt;
    for (let i = 0; i < 3; i++) d.p[i] += d.v[i] * dt;
    const wl = Math.hypot(...d.w);
    if (wl > 1e-6) d.q = qnorm(qmul(qaxis(d.w.map(c => c / wl), wl * dt), d.q));

    const m = qmat(d.q);
    const floor = HALF * (Math.abs(m[2][0]) + Math.abs(m[2][1]) + Math.abs(m[2][2]));
    const late = elapsed > 1.6;
    let contact = false;
    if (d.p[2] <= floor) {
      d.p[2] = floor; contact = true;
      if (d.v[2] < 0) {
        const vi = -d.v[2];
        d.v[2] = vi > 90 ? vi * 0.42 : 0;
        d.v[0] *= 0.82; d.v[1] *= 0.82;
        for (let i = 0; i < 3; i++) d.w[i] *= 0.72;
        if (vi > 90) { d.w[0] += rand(-1, 1) * vi * 0.012; d.w[1] += rand(-1, 1) * vi * 0.012; d.w[2] += rand(-1, 1) * vi * 0.006; }
      }
    }
    // walls
    const lx = W / 2 - RADIUS, ly = H / 2 - RADIUS;
    if (d.p[0] > lx) { d.p[0] = lx; if (d.v[0] > 0) { d.v[0] *= -0.5; d.w[2] += rand(-3, 3); } }
    if (d.p[0] < -lx) { d.p[0] = -lx; if (d.v[0] < 0) { d.v[0] *= -0.5; d.w[2] += rand(-3, 3); } }
    if (d.p[1] > ly) { d.p[1] = ly; if (d.v[1] > 0) { d.v[1] *= -0.5; d.w[2] += rand(-3, 3); } }
    if (d.p[1] < -ly) { d.p[1] = -ly; if (d.v[1] < 0) { d.v[1] *= -0.5; d.w[2] += rand(-3, 3); } }

    if (contact) {
      const sp = Math.hypot(d.v[0], d.v[1]);
      const fr = Math.exp(-(late ? 9 : 3.4) * dt);
      d.v[0] *= fr; d.v[1] *= fr;
      // rolling: spin follows the sliding direction
      const k = Math.min(1, 8 * dt);
      d.w[0] += (-d.v[1] / HALF - d.w[0]) * k;
      d.w[1] += (d.v[0] / HALF - d.w[1]) * k;
      d.w[2] *= Math.exp(-3 * dt);
      if (late) for (let i = 0; i < 3; i++) d.w[i] *= Math.exp(-6 * dt);
      // tip over onto the nearest (or forced) flat face once slow enough
      if (sp < 200 || late) {
        const n = forcedFace ? mulv(m, FACE_N[forcedFace]) : topFace(d.q).n;
        d.q = qnorm(qmul(arcToUp(n, Math.min(1, (late ? 25 : 9) * dt)), d.q));
      }
      const n2 = forcedFace ? mulv(qmat(d.q), FACE_N[forcedFace]) : topFace(d.q).n;
      if (sp < 8 && Math.hypot(...d.w) < 0.6 && n2[2] > 0.9995) d.calm += dt; else d.calm = 0;
      if (d.calm > 0.15) {
        d.q = qnorm(qmul(arcToUp(n2), d.q));
        d.v = [0, 0, 0]; d.w = [0, 0, 0]; d.done = true;
      }
    } else {
      d.calm = 0;
    }
  }

  function collide(a, b) {
    const dx = b.p[0] - a.p[0], dy = b.p[1] - a.p[1];
    const dist = Math.hypot(dx, dy), min = RADIUS * 1.9;
    if (dist >= min || dist < 1e-6 || Math.abs(a.p[2] - b.p[2]) > SIZE * 0.9) return;
    const nx = dx / dist, ny = dy / dist, push = (min - dist) / 2;
    a.p[0] -= nx * push; a.p[1] -= ny * push; b.p[0] += nx * push; b.p[1] += ny * push;
    const rv = (b.v[0] - a.v[0]) * nx + (b.v[1] - a.v[1]) * ny;
    if (rv < 0) {
      const j = -(1 + 0.5) * rv / 2;
      a.v[0] -= j * nx; a.v[1] -= j * ny; b.v[0] += j * nx; b.v[1] += j * ny;
      for (const d of [a, b]) { d.done = false; d.calm = 0; d.w[0] += rand(-4, 4); d.w[1] += rand(-4, 4); }
    }
  }

  // Throw both dice; resolves with the two values that end up face up.
  function throwDice() {
    return new Promise(resolve => {
      layout();
      const forced = window.__forceDice || null;   // debug/test hook: window.__forceDice = [a, b]
      window.__forceDice = null;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        rest(forced || [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)]);
        setTimeout(() => resolve(values()), 300);
        return;
      }
      const ySign = Math.random() < 0.5 ? 1 : -1;
      dice.forEach((d, i) => {
        d.p = [-W / 2 + RADIUS + 10 + i * 50, ySign * (i === 0 ? 1 : -1) * rand(20, H / 3), rand(150, 190) + i * 85];
        d.v = [rand(130, 230), rand(-90, 90), rand(-60, 0)];
        d.q = qrand();
        const wv = [rand(-1, 1), rand(-1, 1), rand(-1, 1)], wl = Math.hypot(...wv) || 1, mag = rand(11, 19);
        d.w = wv.map(c => c / wl * mag);
        d.done = false; d.calm = 0;
      });
      let last = performance.now(), elapsed = 0;
      cancelAnimationFrame(raf);
      const frame = now => {
        const frameDt = Math.min((now - last) / 1000, 1 / 20);
        last = now; elapsed += frameDt;
        const n = Math.ceil(frameDt / (1 / 240));
        for (let s = 0; s < n; s++) {
          for (let i = 0; i < 2; i++) if (!dice[i].done) step(dice[i], frameDt / n, elapsed, forced && forced[i]);
          collide(dice[0], dice[1]);
        }
        dice.forEach(toCss);
        if (dice.every(d => d.done) || elapsed > 6) {
          if (!dice.every(d => d.done)) dice.forEach((d, i) => {
            const f = forced ? FACE_N[forced[i]] : null;
            d.q = qnorm(qmul(arcToUp(f ? mulv(qmat(d.q), f) : topFace(d.q).n), d.q));
            d.p[2] = HALF; d.v = [0, 0, 0]; d.w = [0, 0, 0]; d.done = true; toCss(d);
          });
          resolve(values());
          return;
        }
        raf = requestAnimationFrame(frame);
      };
      raf = requestAnimationFrame(frame);
    });
  }

  // Flip both dice over (6 becomes 1, 5 becomes 2, ...). Resolves with the new values.
  function flipOver() {
    return new Promise(resolve => {
      const from = dice.map(d => d.q.slice());
      const to = dice.map(d => {
        const target = 7 - topFace(d.q).value;
        return qnorm(qmul(arcToUp(mulv(qmat(d.q), FACE_N[target])), d.q));
      });
      const base = dice.map(d => d.p[2]);
      const start = performance.now(), dur = 1000;
      const frame = now => {
        const t = clamp((now - start) / dur, 0, 1), e = t * t * (3 - 2 * t);
        dice.forEach((d, i) => {
          d.q = qslerp(from[i], to[i], e);
          d.p[2] = base[i] + 80 * Math.sin(Math.PI * t);
          toCss(d);
        });
        if (t < 1) { requestAnimationFrame(frame); return; }
        dice.forEach((d, i) => { d.q = to[i]; d.p[2] = base[i]; toCss(d); });
        resolve(values());
      };
      requestAnimationFrame(frame);
    });
  }

  return { init, rest, throwDice, flipOver, values };
})();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- Init ---------- */
renderSetup(loadNames());
</script>
