name: Bouw Android-app (APK)

on:
  push:
    branches: [main, claude/amazing-curie-t9mtd5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Afhankelijkheden installeren en webbestanden klaarzetten
        run: |
          npm ci
          npm run www

      - name: Android-project aanmaken
        run: npx cap add android

      - name: Icoon en schermstand instellen
        run: |
          RES=android/app/src/main/res
          cp -r icons/android/. $RES/
          sed -i 's/#FFFFFF/#1d4d39/' $RES/values/ic_launcher_background.xml
          sed -i 's/android:configChanges=/android:screenOrientation="portrait" android:configChanges=/' android/app/src/main/AndroidManifest.xml

      - name: APK bouwen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dobbelen-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dobbelen-web
          path: www
